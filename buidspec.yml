version: 0.2

env:
  variables:
    ECR_REPOSITORY: "fun-club"

phases:
  install:
    commands:
      - echo "Checking the Ubuntu build environment..."
      - docker --version
      - aws --version

  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - ECR_REGISTRY=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - ECR_IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - if [ -z "$IMAGE_TAG" ]; then IMAGE_TAG="latest"; fi
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

  build:
    commands:
      - echo "Building $ECR_IMAGE:$IMAGE_TAG"
      - docker build -t $ECR_IMAGE:$IMAGE_TAG .
      - docker tag $ECR_IMAGE:$IMAGE_TAG $ECR_IMAGE:latest

  post_build:
    commands:
      - echo "Pushing images to Amazon ECR..."
      - docker push $ECR_IMAGE:$IMAGE_TAG
      - docker push $ECR_IMAGE:latest
      - echo "Image successfully pushed:"
      - echo "$ECR_IMAGE:$IMAGE_TAG"
